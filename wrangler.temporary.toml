# Config for `wrangler deploy --temporary` (no-login preview account; claim it within 60 min).
# Temporary accounts don't support R2, so photos stay on the phones until a bucket is bound.
name = "van-fix"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "van-fix"
