<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Van Fix: a field app for diagnosing a 2012 Sprinter's dead horn, A/C and trailer lights">
  <defs>
    <pattern id="haz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="14" height="28" fill="#ffc21a"/><rect x="14" width="14" height="28" fill="#121417"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1d2a3e" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#101b2c" stop-opacity="0"/><stop offset="1" stop-color="#101b2c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" fill="#121417"/>
  <rect x="640" width="640" height="420" fill="#101b2c"/>
  <rect x="640" width="640" height="420" fill="url(#grid)"/>
  <rect x="640" width="160" height="420" fill="url(#fade)" transform="rotate(180 720 210)"/>
  <rect y="392" width="1280" height="28" fill="url(#haz)"/>

  <!-- wordmark -->
  <svg x="72" y="86" width="68" height="68" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#ffc21a"/><g fill="none" stroke="#121417" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"><path d="M70 330V200q0-40 40-40h200l110 90v80z"/><path d="M320 160v95h100"/></g><circle cx="150" cy="350" r="42" fill="#121417"/><circle cx="360" cy="350" r="42" fill="#121417"/><path d="M262 92 212 190h44l-14 70 60-108h-46z" fill="#121417"/></svg>
  <text x="156" y="146" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="92" letter-spacing="2" fill="#ffc21a">VAN FIX</text>
  <text x="74" y="208" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="30" fill="#f1ede4">Field repair tracker for one stubborn Sprinter</text>
  <text x="74" y="246" font-family="'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#b3b8c0">2012 Freightliner Sprinter 2500 · 3.0L V6 diesel · W906</text>

  <!-- symptom chips -->
  <g font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="19">
    <g transform="translate(74 290)"><rect width="128" height="46" rx="23" fill="none" stroke="#ff6b5e" stroke-width="3"/><text x="64" y="30" text-anchor="middle" fill="#f1ede4">HORN ✕</text></g>
    <g transform="translate(216 290)"><rect width="150" height="46" rx="23" fill="none" stroke="#ff6b5e" stroke-width="3"/><text x="75" y="30" text-anchor="middle" fill="#f1ede4">A/C COMP ✕</text></g>
    <g transform="translate(380 290)"><rect width="188" height="46" rx="23" fill="none" stroke="#ff6b5e" stroke-width="3"/><text x="94" y="30" text-anchor="middle" fill="#f1ede4">TRAILER LIGHTS ✕</text></g>
  </g>
  <text x="74" y="370" font-family="'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#b3b8c0">All three died at once. Measure, log, rule things out, together.</text>

  <!-- blueprint van (driver's side) -->
  <g transform="translate(762 66) scale(0.66)" fill="none" stroke="#cfe0ff" stroke-width="3" stroke-linejoin="round">
    <path d="M32 252 L28 222 Q27 200 42 193 L118 170 Q136 165 146 154 L198 70 Q208 54 232 52 L672 50 Q690 50 692 66 L694 252 L566 252 A46 46 0 0 0 474 252 L178 252 A46 46 0 0 0 86 252 Z" fill="#17243a"/>
    <path d="M158 150 L202 82 Q206 76 214 76 L262 76 L262 150 Z" fill="#22344f"/>
    <path d="M268 58 V250 M290 150 H680" stroke-width="2" opacity=".6"/>
    <circle cx="132" cy="262" r="34" fill="#cfe0ff" stroke="none"/><circle cx="132" cy="262" r="14" fill="#22344f" stroke="none"/>
    <circle cx="520" cy="262" r="34" fill="#cfe0ff" stroke="none"/><circle cx="520" cy="262" r="14" fill="#22344f" stroke="none"/>
    <rect x="22" y="150" width="128" height="106" rx="12" fill="rgba(255,194,26,.25)" stroke="#ffc21a" stroke-dasharray="9 6" stroke-width="3"/>
  </g>
  <g font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="15" text-anchor="middle">
    <g transform="translate(813 223)"><circle r="17" fill="#ffc21a" stroke="#121417" stroke-width="3"/><text y="5" fill="#121417">1</text></g>
    <g transform="translate(840 193)"><circle r="17" fill="#ffc21a" stroke="#121417" stroke-width="3"/><text y="5" fill="#121417">2</text></g>
    <g transform="translate(876 211)"><circle r="17" fill="#d33a2c" stroke="#121417" stroke-width="3"/><text y="5" fill="#fff">4</text></g>
    <g transform="translate(1222 228)"><circle r="17" fill="#ffc21a" stroke="#121417" stroke-width="3"/><text y="5" fill="#121417">7</text></g>
  </g>
  <!-- mini meter readout -->
  <g transform="translate(1012 290)" font-family="ui-monospace,Menlo,monospace">
    <rect width="200" height="84" rx="12" fill="#ffc21a" stroke="#121417" stroke-width="3"/>
    <rect x="12" y="12" width="176" height="42" rx="6" fill="#c8d9b0" stroke="#121417" stroke-width="2"/>
    <text x="100" y="42" text-anchor="middle" font-weight="700" font-size="26" fill="#10210a">0.35 V</text>
    <text x="100" y="74" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="14" fill="#b0221a">FAIL · over 0.2 V rule</text>
  </g>
</svg>
