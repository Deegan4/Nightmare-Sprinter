name = "van-fix"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "van-fix"
database_id = "ed245535-d8d3-4cd3-853a-02e33f6f9338"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "van-fix"

[triggers]
crons = ["17 9 * * *"] # nightly JSON backup to R2 (09:17 UTC)

# Optional var: SERVE_MANUALS = "1" serves manual page images (only for a private deployment).
